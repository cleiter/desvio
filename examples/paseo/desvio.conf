# shellcheck shell=bash
# shellcheck disable=SC2034  # every DESVIO_* here is read by desvio's own
# lib/*.sh once this file is sourced, not from within it — shellcheck cannot
# see that checking this file alone.
#
# desvio configuration for Paseo (https://github.com/getpaseo/paseo).
#
# Copy this directory somewhere outside the checkout — ~/.paseo-fork is a good
# home — put your branch names in manifest.txt, and run `desvio build` from it.
# Everything below is either a path you must correct or a Paseo-specific reason
# worth reading before you copy it into a config for another project.

DESVIO_REPO="$HOME/workspace/paseo"   # your Paseo checkout — the branches live here
DESVIO_BRANCH="plus"                  # disposable; recreated from scratch every build
DESVIO_NAME="paseo-plus"              # what the summary calls it
DESVIO_BASE="origin/main"             # Paseo's default branch

# Settings that mean something only to Paseo — what the bundle is called, where
# it installs — live in paseo.conf beside the scripts that read them. desvio is
# generic; this file is its configuration and holds DESVIO_* only.

# node_modules is minutes of install and .expo/dist are generated: wiping them on
# every stray file would turn a 30-second build into a 5-minute one.
DESVIO_CLEAN_KEEP="-e node_modules -e .expo -e dist"

# Refuse to build while a daemon serves this tree. There is ONE build tree, and
# rebuilding under a live daemon rewrites dist/ beneath a process that lazily
# requires from it. `npm start` runs the server workspace, so the daemon's cwd is
# <tree>/packages/server — every comparison has to be a prefix test, but not a
# bare glob, or a sibling tree named <tree>-other matches too.
#
# The pidfile parse below is duplicated in four more places — start.sh (twice),
# install.sh's leftover-daemon guard, and stop.sh's pidfile_pid — because these
# scripts are meant to be lifted one at a time, and a shared source would break
# that. If Paseo ever changes paseo.pid's format, all five need the same fix; a
# silent miss here means a preflight that reports "no daemon" while one is up,
# and a build that rewrites dist/ underneath it. paseo_daemon_cwd below is
# duplicated for the same reason, once more, in start.sh.
#
# /proc first, lsof as the fallback: lsof is not installed by default on Arch
# or in most minimal images, and its absence is silent — the command
# substitution yields an empty digest, which read as "no daemon" here and let
# a rebuild rewrite dist/ under a live one.
paseo_daemon_cwd() {
  local pid="$1" cwd=""
  if [ -e /proc/self/cwd ]; then
    cwd=$(readlink "/proc/$pid/cwd" 2>/dev/null || true)
  fi
  [ -n "$cwd" ] || cwd=$(lsof -a -p "$pid" -d cwd -Fn 2>/dev/null | sed -n 's/^n//p' | head -1)
  printf '%s' "${cwd% (deleted)}"
}

desvio_preflight() {
  local pidfile="$HOME/.paseo/paseo.pid" pid cwd
  [ -f "$pidfile" ] || return 0
  pid=$(sed -n 's/.*"pid"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p' "$pidfile" | head -1)
  [ -n "${pid:-}" ] && kill -0 "$pid" 2>/dev/null || return 0
  cwd=$(paseo_daemon_cwd "$pid")
  # A live daemon whose tree we cannot name is not a pass. The whole point of
  # this hook is to refuse, and giving up quietly is worse than no guard at
  # all — it reports success on the one build most likely to be wrong: the
  # first one on a virgin worktree.
  [ -n "$cwd" ] || die "a daemon (pid $pid) is running and this machine cannot say
  which tree it serves — no /proc, and lsof is not installed.
  Install lsof, or stop the daemon, then re-run."
  case "$cwd" in
    "$DESVIO_WORKTREE"|"$DESVIO_WORKTREE"/*)
      die "a daemon (pid $pid) is serving from this tree:
    $cwd
  Quit it first, then re-run." ;;
  esac
}

desvio_install() {
  if stamp_changed deps package-lock.json; then
    log "npm ci (lockfile changed — this takes a few minutes)"
    in_tree npm ci
    stamp_write deps package-lock.json
  else
    log "dependencies current — skipping npm ci"
  fi
}

# Expo generates this file, git ignores it, so a fresh worktree has none and the
# app's typecheck fails for reasons that have nothing to do with your branches.
# Copy it rather than starting an Expo server: no port to collide, no child
# process to reap, no poll loop to hang. If it is stale, typecheck says so.
desvio_seed() {
  local rel="packages/app/.expo/types/router.d.ts"
  if [ ! -f "$DESVIO_WORKTREE/$rel" ] && [ -f "$DESVIO_REPO/$rel" ]; then
    log "seeding $rel from $DESVIO_REPO"
    mkdir -p "$DESVIO_WORKTREE/$(dirname "$rel")"
    cp "$DESVIO_REPO/$rel" "$DESVIO_WORKTREE/$rel"
  fi
}

desvio_build() {
  log "build:server (the daemon runs from dist/)"
  in_tree npm run build:server
}

# Both, always. Paseo's typecheck catches a merge that dropped an import;
# lint catches the rest. This gate is the only thing standing between a clean
# textual merge and a broken build — see the settings-schema story in the README.
desvio_verify() {
  in_tree npm run typecheck
  in_tree npm run lint
}

# What a bisect probes with when it is working out which branch broke the gate. Typecheck only: it is the half that has ever caught a bad merge here —
# a dropped import, a call whose signature moved, a style key that no longer
# exists — and lint is the half that never has. Half the runtime, all the signal.
desvio_verify_quick() {
  in_tree npm run typecheck
}

desvio_next_steps() {
  cat <<TXT
Start it (stop the current daemon first):
  desvio run start

Or package it into an app that carries its own daemon, then install that:
  desvio run package install

Restart the UI too — Metro and Electron resolve their root at startup and will
otherwise keep serving the previous tree.

Leave PASEO_LISTEN unset: the listen address comes from the real config.json, so
the relay keypair is untouched and the phone reconnects on its own.

Take it all down again — app, daemon, and the agent processes quitting the app
leaves behind:
  desvio run stop        (add --dry-run to see what it would kill first)
TXT
}
