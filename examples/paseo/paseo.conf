# Paseo's own settings, read by the task scripts in this directory.
#
# Deliberately NOT in desvio.conf. desvio is a generic tool: it assembles
# branches and runs your hooks, and it has no opinion about what a bundle is
# called or where an app is installed. desvio.conf holds DESVIO_* and stops.
# Anything that only means something to Paseo belongs here, next to the scripts
# that read it.
#
# Sourced as bash, so a value can be computed. Every setting takes its value from
# the environment first, so a one-off still works:
#
#   PASEO_APP_DEST=~/Applications desvio run install

# The name of the packaged bundle. Change it and `desvio run install` puts
# "Paseo Mine.app" in /Applications beside a stock Paseo.app instead of over it.
#
# The rename is cosmetic, and that is the point: packages/desktop/src/main.ts
# hardcodes
#
#   const APP_NAME = process.env.PASEO_TEST_APP_NAME?.trim() || "Paseo";
#   app.setName(APP_NAME);
#
# and the userData directory follows app.setName(), not the product name. So both
# bundles read the same hosts, settings and conversations — pick either icon, same
# data. That directory also holds Electron's single-instance lock, so run one at a
# time: launching the second while the first is up just brings the first forward.
PASEO_PRODUCT_NAME="${PASEO_PRODUCT_NAME:-Paseo}"

# The bundle identifier. Only used when the bundle is renamed — two bundles
# claiming sh.paseo.desktop leaves LaunchServices to pick between them for
# `open -b` and for the paseo:// scheme. Derived from the product name when unset.
# PASEO_APP_ID="sh.paseo.desktop.mine"

# Where `desvio run install` puts it.
# PASEO_APP_DEST="/Applications"

# The app's data directory. Not derived from PASEO_PRODUCT_NAME, for the reason
# above — the app itself always uses this one.
# PASEO_USER_DATA="$HOME/Library/Application Support/Paseo"

# The real daemon home that `desvio run start` runs your build against.
# PASEO_REAL_HOME="$HOME/.paseo"

# Version of the packaged app. Defaults to upstream's, with this build marked as
# a prerelease of it: 0.4.0-mine.260814-0646
# PASEO_PACKAGE_VERSION="1.2.3"
# PASEO_FORK_NAME="mine"
